version: 1

fields:
  required: ["type", "slug", "title"]
  optional:
    - description
    - draft
    - noindex
    - nav_order
    - updated_at
    - related
    # --- карточка кейса ---
    - group          # sites | products | ai | research | lab
    - group_title
    - kicker         # надпись над заголовком
    - summary        # одно предложение для карточки
    - featured       # показывать на главной
    - shot           # имя файла в theme/assets/shots
    - mark           # короткий код для заглушки вместо скриншота
    - shot_caption
    - cover          # grid | rings | waves | dots | beam — обложка вместо снимка
    - gallery
    - status         # «работает», «MVP», «в разработке»
    - status_kind    # live | wip | idea — цвет точки статуса
    - shot_url       # подпись адреса в рамке скриншота
    - role
    - period
    - client
    - stack
    - tags
    - facts
    - links
    - highlights
    - placeholder_note
    # --- страницы верхнего уровня ---
    - hero_kicker
    - hero_title
    - hero_lead
    - hero_note
    - stats
    - hero_stats
    - services
    - more_services
    - process
    - skills
    - faq
    - cta_title
    - cta_note
    - quick          # строки в карточке первого экрана
    - more_items     # небольшие работы без отдельных страниц

fm_schema:
  draft: boolean
  noindex: boolean
  featured: boolean
  nav_order: number
  related: string[]
  tags: string[]
  stack: string[]
  highlights: string[]

types:
  home:
    template: "home.html"
    permalink: "/"
    include_in: { sitemap: true, search: false }
  case:
    template: "case.html"
    permalink: "/cases/{{ slug }}/"
    include_in: { sitemap: true, search: true }
  page:
    template: "page.html"
    permalink: "/{{ slug }}/"
    include_in: { sitemap: true, search: true }
  notfound:
    template: "notfound.html"
    permalink: "/404/"
    include_in: { sitemap: false, search: false }

links:
  - name: "related"
    kind: "field"
    field: "related"
    from_types: ["home", "case", "page"]
    to_types: ["home", "case", "page"]
    to: "slug"
    value_syntax: "auto"
    resolve:
      order: ["path", "filename", "slug"]
      ambiguity: "error"
      missing: "warn_skip"
      case: "insensitive"
  - name: "wiki"
    kind: "wikilinks"
    from_types: ["home", "case", "page", "notfound"]
    resolve_by: "wikimap"
    to_types: ["home", "case", "page"]
    resolve:
      order: ["path", "filename", "slug"]
      ambiguity: "error"
      missing: "warn_skip"
      case: "insensitive"

collections:
  cases_all:
    kind: "filter"
    materialize: true
    where:
      all:
        - fm_eq: { key: "draft", value: false }
        - type_in: ["case"]
    sort: { by: "fm.nav_order", dir: "asc", nulls_last: true }
    limit: 100
  cases_featured:
    kind: "filter"
    materialize: true
    where:
      all:
        - fm_eq: { key: "draft", value: false }
        - fm_eq: { key: "featured", value: true }
        - type_in: ["case"]
    sort: { by: "fm.nav_order", dir: "asc", nulls_last: true }
    limit: 12
  cases_sites:
    kind: "filter"
    materialize: true
    where:
      all:
        - fm_eq: { key: "draft", value: false }
        - fm_eq: { key: "group", value: "sites" }
        - type_in: ["case"]
    sort: { by: "fm.nav_order", dir: "asc", nulls_last: true }
    limit: 50
  cases_products:
    kind: "filter"
    materialize: true
    where:
      all:
        - fm_eq: { key: "draft", value: false }
        - fm_eq: { key: "group", value: "products" }
        - type_in: ["case"]
    sort: { by: "fm.nav_order", dir: "asc", nulls_last: true }
    limit: 50
  cases_ai:
    kind: "filter"
    materialize: true
    where:
      all:
        - fm_eq: { key: "draft", value: false }
        - fm_eq: { key: "group", value: "ai" }
        - type_in: ["case"]
    sort: { by: "fm.nav_order", dir: "asc", nulls_last: true }
    limit: 50
  cases_research:
    kind: "filter"
    materialize: true
    where:
      all:
        - fm_eq: { key: "draft", value: false }
        - fm_eq: { key: "group", value: "research" }
        - type_in: ["case"]
    sort: { by: "fm.nav_order", dir: "asc", nulls_last: true }
    limit: 50
  cases_lab:
    kind: "filter"
    materialize: true
    where:
      all:
        - fm_eq: { key: "draft", value: false }
        - fm_eq: { key: "group", value: "lab" }
        - type_in: ["case"]
    sort: { by: "fm.nav_order", dir: "asc", nulls_last: true }
    limit: 50
  related_cases:
    kind: "forward"
    materialize: false
    link: "related"
    from_slug: "{{ page.slug }}"
    where:
      all:
        - fm_eq: { key: "draft", value: false }
        - type_in: ["case"]
    limit: 3

sitemap:
  include_types: ["home", "case", "page"]
  exclude_drafts: true

search:
  include_types: ["case", "page"]
  exclude_drafts: true
  fields_boost:
    title: 3
    description: 2
    body: 1
  preview:
    from: "description"
    max_len: 180

artifacts:
  collections:
    enabled: true
    dir: "collections"

validation:
  single_page_of_type: { home: 1 }
  duplicate_route: { action: "error" }
  unknown_type: { action: "error" }
  unique_slug: { action: "error" }
  permalink_requires_slug: { action: "error" }
  missing_template: { action: "error" }
  materialize_requires_limit: true
  materialize_group_by_requires_item_limit: true
