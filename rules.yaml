version: 1

fields:
  required: ["type", "slug", "title"]
  optional:
    - description
    - draft
    - noindex
    - og_image        # картинка для og:image; иначе берётся default_og_image
    - person_page     # страница-визитка: даёт ProfilePage вместо WebPage
    - redirect_to     # адрес назначения; движок отдаёт 301, в статике — страницу-редирект
    - nav_order
    - updated_at
    - related
    # --- карточка кейса ---
    - group          # sites | products | ai | research | lab | components
    - group_title
    - kicker         # надпись над заголовком
    - summary        # одно предложение для карточки
    - featured       # показывать на главной
    - shot           # имя файла в theme/assets/shots
    - mark           # короткий код для заглушки вместо скриншота
    - shot_caption
    - cover          # grid | rings | waves | dots | beam — обложка вместо снимка
    - gallery
    - status         # «работает», «MVP», «в разработке»
    - status_kind    # live | wip | idea — цвет точки статуса
    - shot_url       # подпись адреса в рамке скриншота
    - role
    - period
    - client
    - stack
    - tags
    - facts
    - links
    - highlights
    - placeholder_note
    - demo            # живой компонент на странице кейса: plan | calc | book
    # --- страницы верхнего уровня ---
    - hero_kicker
    - hero_title
    - hero_lead
    - hero_note
    - stats
    - hero_stats
    - services
    - more_services
    - process
    - skills
    - faq
    - cta_title
    - cta_note
    - razbor         # блок «Разбор» на главной: title/text/items/link
    - quick          # строки в карточке первого экрана
    - more_items     # небольшие работы без отдельных страниц
    # --- блог ---
    - published_at   # ISO-дата публикации: сортировка ленты, <time> и datePublished
    - date_label     # та же дата по-русски для показа; движок форматировать не умеет
    - keywords       # целевые запросы кластера
    - cluster        # id кластера в реестре — защита от каннибализации
    - cta_service    # slug услуги, куда ведёт статья
    - lead           # лид-абзац над текстом
    # --- страница инструмента ---
    - endpoint       # адрес бэкенда инструмента
    - tool_prompt    # заголовок над полем ввода
    - how_it_works   # slug статьи-объяснения
    # --- заметки (/notes/) ---
    - topic          # ярлык темы: лингвистика | системное мышление | наблюдение | метод
    # --- страница услуги ---
    - includes       # что входит в работу
    - price_from     # ориентир цены
    - price_note     # чем цена определяется
    - service_cases  # slug-и кейсов как доказательство

fm_schema:
  draft: boolean
  noindex: boolean
  featured: boolean
  nav_order: number
  related: string[]
  tags: string[]
  stack: string[]
  highlights: string[]
  keywords: string[]
  includes: string[]
  service_cases: string[]
  published_at: string
  date_label: string
  cluster: string
  cta_service: string
  topic: string

types:
  home:
    template: "home.html"
    permalink: "/"
    include_in: { sitemap: true, search: false }
  case:
    template: "case.html"
    permalink: "/cases/{{ slug }}/"
    include_in: { sitemap: true, search: true }
  page:
    template: "page.html"
    permalink: "/{{ slug }}/"
    include_in: { sitemap: true, search: true }
  service:
    template: "service.html"
    permalink: "/services/{{ slug }}/"
    include_in: { sitemap: true, search: true }
  tool:
    template: "tool.html"
    permalink: "/tools/{{ slug }}/"
    include_in: { sitemap: true, search: true }
  blog:
    template: "blog.html"
    permalink: "/blog/"
    include_in: { sitemap: true, search: false }
  article:
    template: "article.html"
    permalink: "/blog/{{ slug }}/"
    include_in: { sitemap: true, search: true }
  notes:
    template: "notes.html"
    permalink: "/notes/"
    include_in: { sitemap: true, search: false }
  note:
    template: "note.html"
    permalink: "/notes/{{ slug }}/"
    include_in: { sitemap: true, search: true }
  notfound:
    template: "notfound.html"
    permalink: "/404/"
    include_in: { sitemap: false, search: false }

links:
  - name: "related"
    kind: "field"
    field: "related"
    from_types: ["home", "case", "page", "article", "service", "blog", "tool", "notes", "note"]
    to_types: ["home", "case", "page", "article", "service", "note"]
    to: "slug"
    value_syntax: "auto"
    resolve:
      order: ["path", "filename", "slug"]
      ambiguity: "error"
      missing: "warn_skip"
      case: "insensitive"
  - name: "wiki"
    kind: "wikilinks"
    from_types: ["home", "case", "page", "article", "service", "blog", "tool", "notes", "note", "notfound"]
    resolve_by: "wikimap"
    to_types: ["home", "case", "page", "article", "service", "note"]
    resolve:
      order: ["path", "filename", "slug"]
      ambiguity: "error"
      missing: "warn_skip"
      case: "insensitive"

collections:
  cases_all:
    kind: "filter"
    materialize: true
    where:
      all:
        - fm_eq: { key: "draft", value: false }
        - type_in: ["case"]
    sort: { by: "fm.nav_order", dir: "asc", nulls_last: true }
    limit: 100
  cases_featured:
    kind: "filter"
    materialize: true
    where:
      all:
        - fm_eq: { key: "draft", value: false }
        - fm_eq: { key: "featured", value: true }
        - type_in: ["case"]
    sort: { by: "fm.nav_order", dir: "asc", nulls_last: true }
    limit: 12
  cases_sites:
    kind: "filter"
    materialize: true
    where:
      all:
        - fm_eq: { key: "draft", value: false }
        - fm_eq: { key: "group", value: "sites" }
        - type_in: ["case"]
    sort: { by: "fm.nav_order", dir: "asc", nulls_last: true }
    limit: 50
  cases_products:
    kind: "filter"
    materialize: true
    where:
      all:
        - fm_eq: { key: "draft", value: false }
        - fm_eq: { key: "group", value: "products" }
        - type_in: ["case"]
    sort: { by: "fm.nav_order", dir: "asc", nulls_last: true }
    limit: 50
  cases_ai:
    kind: "filter"
    materialize: true
    where:
      all:
        - fm_eq: { key: "draft", value: false }
        - fm_eq: { key: "group", value: "ai" }
        - type_in: ["case"]
    sort: { by: "fm.nav_order", dir: "asc", nulls_last: true }
    limit: 50
  cases_research:
    kind: "filter"
    materialize: true
    where:
      all:
        - fm_eq: { key: "draft", value: false }
        - fm_eq: { key: "group", value: "research" }
        - type_in: ["case"]
    sort: { by: "fm.nav_order", dir: "asc", nulls_last: true }
    limit: 50
  cases_components:
    kind: "filter"
    materialize: true
    where:
      all:
        - fm_eq: { key: "draft", value: false }
        - fm_eq: { key: "group", value: "components" }
        - type_in: ["case"]
    sort: { by: "fm.nav_order", dir: "asc", nulls_last: true }
    limit: 50
  cases_lab:
    kind: "filter"
    materialize: true
    where:
      all:
        - fm_eq: { key: "draft", value: false }
        - fm_eq: { key: "group", value: "lab" }
        - type_in: ["case"]
    sort: { by: "fm.nav_order", dir: "asc", nulls_last: true }
    limit: 50
  posts_all:
    kind: "filter"
    materialize: true
    where:
      all:
        - fm_eq: { key: "draft", value: false }
        - type_in: ["article"]
    sort: { by: "fm.published_at", dir: "desc", nulls_last: true }
    limit: 500
  posts_recent:
    kind: "filter"
    materialize: true
    where:
      all:
        - fm_eq: { key: "draft", value: false }
        - type_in: ["article"]
    sort: { by: "fm.published_at", dir: "desc", nulls_last: true }
    limit: 4
  notes_all:
    kind: "filter"
    materialize: true
    where:
      all:
        - fm_eq: { key: "draft", value: false }
        - type_in: ["note"]
    sort: { by: "fm.published_at", dir: "desc", nulls_last: true }
    limit: 200
  notes_recent:
    kind: "filter"
    materialize: true
    where:
      all:
        - fm_eq: { key: "draft", value: false }
        - type_in: ["note"]
    sort: { by: "fm.nav_order", dir: "asc", nulls_last: true }
    limit: 3
  services_all:
    kind: "filter"
    materialize: true
    where:
      all:
        - fm_eq: { key: "draft", value: false }
        - type_in: ["service"]
    sort: { by: "fm.nav_order", dir: "asc", nulls_last: true }
    limit: 50
  related_cases:
    kind: "forward"
    materialize: false
    link: "related"
    from_slug: "{{ page.slug }}"
    where:
      all:
        - fm_eq: { key: "draft", value: false }
        - type_in: ["case"]
    limit: 3

sitemap:
  include_types: ["home", "case", "page", "service", "blog", "article", "tool", "notes", "note"]
  exclude_drafts: true

search:
  include_types: ["case", "page", "service", "article", "tool", "note"]
  exclude_drafts: true
  fields_boost:
    title: 3
    description: 2
    body: 1
  preview:
    from: "description"
    max_len: 180

artifacts:
  collections:
    enabled: true
    dir: "collections"

validation:
  single_page_of_type: { home: 1, blog: 1, notes: 1 }
  duplicate_route: { action: "error" }
  unknown_type: { action: "error" }
  unique_slug: { action: "error" }
  permalink_requires_slug: { action: "error" }
  missing_template: { action: "error" }
  materialize_requires_limit: true
  materialize_group_by_requires_item_limit: true
