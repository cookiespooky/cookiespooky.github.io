<div class="shell">
  <footer class="site-footer">
    <div class="site-footer__col">
      <span class="site-footer__name">{{ .Settings.owner_name }}</span>
      <span class="site-footer__role">{{ .Settings.owner_role }}</span>
      <a class="link-accent" href="{{ .Settings.telegram_url }}" rel="me noopener" target="_blank">Написать в Telegram →</a>
    </div>
    <div class="site-footer__col">
      <span class="site-footer__label">Разделы</span>
      <a href="{{ .BaseURL }}/#cases">Кейсы</a>
      <a href="{{ .BaseURL }}/services/">Что делаю</a>
      <a href="{{ .BaseURL }}/about/">Обо мне</a>
    </div>
    <div class="site-footer__col">
      <span class="site-footer__label">Соцсети</span>
      <a href="{{ .Settings.telegram_channel_url }}" rel="noopener" target="_blank">Telegram-канал</a>
      <a href="{{ .Settings.threads_url }}" rel="noopener" target="_blank">Threads</a>
      <a href="{{ .Settings.github_url }}" rel="noopener" target="_blank">GitHub</a>
    </div>
    <div class="site-footer__col">
      <span class="site-footer__label">Про сайт</span>
      <span class="site-footer__note">Статика без бэкенда. Собран на <a class="link-accent" href="https://cookiespooky.github.io/np/ru/" rel="noopener" target="_blank">Notepub</a> — моём движке.</span>
    </div>
  </footer>
  <div class="site-bottom">
    <span>© {{ .Settings.owner_name }}</span>
    <span>Проекты под NDA в подборку не входят.</span>
  </div>
</div>
