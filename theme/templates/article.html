<article
  class="graph-home-article graph-article-page"
  data-graph-article
  data-graph-url="{{ .BaseURL }}/media/data/site-graph.json"
  data-atom-id="{{ .FM.id }}"
  data-graph-endpoint="https://functions.yandexcloud.net/d4eqlv2pdrq0ckas1eq6"
  data-graph-stream-endpoint="wss://d5dldktr6e9jr03hm045.nkhmighe.apigw.yandexcloud.net/ws"
>
  <div class="graph-story-meta">
    <span class="graph-kind" data-atom-kind>{{ .FM.kind }}</span>
    {{- with .FM.hub }}
    <span class="graph-hub-label" data-atom-hub>{{ index . 0 }}</span>
    {{- end }}
  </div>

  <h1 class="graph-article-title" data-atom-title>{{ .Title }}</h1>
  <p class="graph-summary" data-atom-summary>{{ .FM.summary }}</p>

  <div class="graph-article-body prose">
    <div class="graph-article-copy" data-atom-copy>
      <div class="prose">
        {{ .Body }}
      </div>
    </div>
    <div class="graph-stream-visual atom-stream-visual" data-atom-visual aria-hidden="true"></div>
  </div>

  <div class="graph-actions-inline" data-atom-actions></div>
</article>
