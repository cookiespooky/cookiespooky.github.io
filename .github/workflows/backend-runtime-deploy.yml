name: Deploy Graph Runtime Backend

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: backend-runtime-deploy
  cancel-in-progress: true

env:
  YC_FOLDER_ID: b1gebm0a43a8g5saqhlu
  YC_SA_ID: ajeqmt4fr1acruob80h1
  YCF_FUNCTION_NAME: np-personal-graph-runtime
  YCF_GATEWAY_NAME: np-personal-graph-runtime-ws
  YCF_RUNTIME_SA_NAME: np-personal-runtime-sa

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate runtime graph
        run: node ./scripts/build-site-graph-mvp.js

      - name: Get Yandex Cloud IAM token
        id: yc-token
        uses: docker://ghcr.io/yc-actions/yc-iam-token-fed:1.0.0
        with:
          yc-sa-id: ${{ env.YC_SA_ID }}

      - name: Install yc CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i /tmp/yc -n
          echo "/tmp/yc/bin" >> "$GITHUB_PATH"

      - name: Configure yc CLI
        run: |
          yc config profile create ci || true
          yc config set token "${{ steps.yc-token.outputs.token }}"
          yc config set folder-id "${{ env.YC_FOLDER_ID }}"

      - name: Deploy function and websocket gateway
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: ./ycf/graph-runtime/deploy.sh

      - name: Allow unauthenticated HTTP invoke
        run: yc serverless function allow-unauthenticated-invoke --name "${{ env.YCF_FUNCTION_NAME }}"

      - name: Print backend endpoints
        run: |
          FUNCTION_URL="$(yc serverless function get --name "${YCF_FUNCTION_NAME}" --format json | jq -r '.http_invoke_url')"
          GATEWAY_DOMAIN="$(yc serverless api-gateway get --name "${YCF_GATEWAY_NAME}" --format json | jq -r '.domain // .connect_url // .service_domain // .url // empty')"
          echo "Function URL: ${FUNCTION_URL}" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -n "${GATEWAY_DOMAIN}" ] && [ "${GATEWAY_DOMAIN}" != "null" ]; then
            echo "WebSocket URL: wss://${GATEWAY_DOMAIN}/ws" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
