# Реестр кластеров запросов. Главный артефакт SEO-завода: он, а не генератор
# текста, не даёт написать вторую статью под тот же интент.
#
# Правило, которое нельзя нарушать: один кластер = один URL.
#
# stage:  seed -> measured -> planned -> written -> published -> tracked
#   seed       фразы выписаны из портфолио, частот ещё нет
#   measured   собраны freq_exact и конкуренция, кластер прошёл или отсеян
#   planned    решено писать, назначен target_url
#   written    файл лежит в content/, ещё не в main
#   published  в выдаче, ждём данных
#   tracked    есть показы/позиции из Вебмастера, решаем расширять или нет
#
# money_distance: 1..5 — сколько шагов от запроса до оплаченной работы.
#   1 человек уже описывает вашу задачу словами
#   2 у него есть проблема, которую вы решаете
#   3 он рядом с темой
#   4-5 общее любопытство — НЕ ПИШЕМ, жёсткий фильтр
#
# freq_broad  число Wordstat без операторов — только чтобы находить идеи
# freq_exact  "!фраза" — единственная частота, по которой приоритизируем

